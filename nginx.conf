pid /tmp/nginx.pid;

load_module modules/ngx_http_js_module.so;

error_log stderr warn;

worker_processes 1;

events { worker_connections 1024; }

http {

    js_import search from /etc/nginx/search.js;

    # List of application servers
    upstream CONTENT {
        server docs-app:8080;
    }
    # The client's address, for logs, X-Real-IP and the search rate limit.
    # Requests come through the Envoy gateway, which runs in the pod range
    # and appends the address it got from the load balancer (PROXY protocol)
    # to X-Forwarded-For. Trust only that range, so a client can't choose its
    # own address with a forged header.
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Per-client limit on /searchapi. search-mcp's anonymous users share one
    # address, so the burst leaves room for several of them at once.
    limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;
    limit_req_status 429;

    upstream SEARCH {
        server sitesearch-app:9200;
    }

    log_format  custom  '"$request" '
        '$status $body_bytes_sent $request_time '
        '"$remote_addr" "$http_x_forwarded_for" '
        '"$http_user_agent" "$http_referer"';

    server_tokens off;

    # Configuration for the server
    server {

        # Running port
        listen 8000;

        # Limit caching of internal DNS entries to 30 seconds
        resolver coredns.kube-system.svc.cluster.local valid=30s;

        proxy_set_header Host       $http_host;   # required for docker client's sake
        proxy_set_header X-Real-IP  $remote_addr; # pass on real client's IP
        proxy_set_header Authorization "";

        # No upstream may redirect internally, in particular not into
        # /_sitesearch, which would pass its query string and the client's
        # body to OpenSearch.
        proxy_ignore_headers X-Accel-Redirect;

        access_log  /dev/stdout  custom;

        client_max_body_size "1m";

        # required to avoid HTTP 411: see Issue #1486 (https://github.com/moby/moby/issues/1486)
        chunked_transfer_encoding on;

        # Redirects template

        rewrite   ^/reference/cp-k8s-api/(?<crd>[^/]+)$                        https://docs.giantswarm.io/ui-api/management-api/crd/$crd/                   redirect;
        rewrite   ^/guides/importing-certificates$                          https://docs.giantswarm.io/getting-started/ca-certificate/                   redirect;
        rewrite   ^/guides/securing-with-rbac-and-psp$                      https://docs.giantswarm.io/getting-started/rbac-and-psp/                     redirect;

        rewrite   ^/basics/kubernetes-fundamentals/$                        https://docs.giantswarm.io/kubernetes/resources/                             permanent;
        rewrite   ^/guides/prepare-azure-subscription-for-guest-clusters/$  https://docs.giantswarm.io/getting-started/cloud-provider-accounts/azure/    redirect;
        rewrite   ^/guides/prepare-aws-account-for-guest-clusters/$         https://docs.giantswarm.io/getting-started/cloud-provider-accounts/aws/      redirect;
        rewrite   ^/reference/giantswarm-aws-architecture/$                 https://docs.giantswarm.io/general/architcture/aws/                          redirect;
        rewrite   ^/reference/giantswarm-onprem-architecture/$              https://docs.giantswarm.io/general/architcture/on-premises/                  redirect;
        rewrite   ^/basics/byoc/$                                           https://docs.giantswarm.io/advanced/multi-account/                           redirect;

        # Removed FAQ page
        rewrite   ^/faq/$                                                   https://docs.giantswarm.io/                                                  permanent;

        # Rest API documentation
        rewrite   ^/api$    https://giantswarm.github.io/api-spec/   redirect;
        rewrite   ^/api/$   https://giantswarm.github.io/api-spec/   redirect;

        location /robots.txt {
            root /www;
        }

        # Search gateway. sitesearch runs without authentication and holds
        # the confidential intranet index, and any caller-supplied _search
        # body can read other indices. So callers pass validated parameters
        # and search.js builds the query and filters the response. See
        # search.js for the parameters.
        location ~ ^/searchapi/?$ {
            limit_except GET {
                deny all;
            }
            limit_req zone=search burst=20 nodelay;
            js_content search.handle;
        }

        # Only reachable through search.js.
        location = /_sitesearch {
            internal;
            proxy_method POST;
            # Send OpenSearch none of the caller's headers: no cookies or
            # credentials, and no Accept-Encoding, since search.js parses
            # the response as plain JSON.
            proxy_pass_request_headers off;
            proxy_set_header Content-Type "application/json";
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # search.js reads the whole response from memory. At most 50
            # hits with five short fields come back.
            subrequest_output_buffer_size 1m;
            # The trailing "?" drops any query string.
            rewrite ^ /docs,handbook,blog/_search? break;
            proxy_pass http://SEARCH;
        }


        # Expires headers for static resources
        location /img {
            expires 1d;
            proxy_pass http://CONTENT;
        }
        location /js {
            expires 100d;
            proxy_pass http://CONTENT;
        }
        location /fonts {
            expires 100d;
            proxy_pass http://CONTENT;
        }
        location /css {
            expires 100d;
            proxy_pass http://CONTENT;
        }

        location /_error {
            root /www;
            internal;
        }

        location /healthz {
            add_header Content-Type text/plain;
            return 200 'Doing fine';
        }

        # CORS headers for RSS feeds
        location ~* index\.xml$ {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Credentials' 'true';

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://CONTENT;
            proxy_intercept_errors on;
        }


        location / {
            proxy_pass http://CONTENT;
            # Error pages
            proxy_intercept_errors on;
            error_page 403 /_error/403.html;
            error_page 404 /_error/404.html;
            error_page 500 502 503 504 /_error/50x.html;
            add_header X-Frame-Options deny always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
        }
    }
}
