# Stub of docs-app for the gateway test. /accel tries to redirect internally
# into the OpenSearch location with a terms lookup on the intranet index.
pid /tmp/nginx.pid;
events {}
http {
    server {
        listen 8080;
        location = /accel {
            add_header X-Accel-Redirect '/_sitesearch?source_content_type=application/json&source={"query":{"terms":{"body":{"index":"intranet","id":"/docs/secret/","path":"body"}}}}';
            return 200 "docs-app\n";
        }
        location / {
            return 200 "docs-app\n";
        }
    }
}
