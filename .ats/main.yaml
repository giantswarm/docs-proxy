# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests) for the
# docs-proxy-app chart. The job creates a kind cluster; ATS applies its bundled
# CRDs (/etc/ats/crds, Gateway API included, which the chart's HTTPRoute
# needs), installs the packaged chart with `helm upgrade --install --wait`
# (tests/test-values.yaml, the namespace below) and runs `pytest -m smoke` in
# tests/ats.
#
# The smoke (tests/ats/test_smoke.py) is the chart-level install check: the
# chart installs on a bare cluster and its Deployment becomes ready with the
# nginx image the branch build pushed (branchPublish in giantswarm/github makes
# execute-chart-tests wait on that push; the chart resolves the image tag from
# the stamped appVersion). The HTTPRoute's parent Gateway does not exist on the
# kind cluster; the route object is accepted by the API server and stays
# unattached, which is all a kind cluster can prove about it.
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: docs-proxy

# functional: no second scenario. upgrade: an upgrade from the last release in
# the catalog is a follow-up.
skip-steps: [functional, upgrade]
